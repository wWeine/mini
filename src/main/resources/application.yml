server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/login_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate   # 让 JPA 校验表结构，不自动建表（脚本已建）
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
     host: localhost
     port: 6379
     password:

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: change_me_change_me_change_me
  expire: 7200   # 秒

logging:
  level:
    org.springframework: INFO
    com.ww.loginmvp: DEBUG
